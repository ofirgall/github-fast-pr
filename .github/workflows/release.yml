name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: make check
      - run: make package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Unversioned name, so releases/latest/download/github-fast-pr.zip always works.
        run: |
          gh release create "${GITHUB_REF_NAME}" github-fast-pr.zip \
            --title "${GITHUB_REF_NAME}" --generate-notes
